services:
  gateway:
    build: .
    container_name: free-llm-hub
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GATEWAY_KEY: ${GATEWAY_KEY:?set GATEWAY_KEY in .env}
      STATE_URL: ${STATE_URL:-}
    volumes:
      - ./output:/app/output:ro
      - ./config:/app/config:ro
